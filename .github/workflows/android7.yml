name: Android 7 build (minSdk 24)

# Fork-only helper: produces an installable APK for Android 7.0/7.1 (API 24/25).
on:
  push:
    branches: [android7-min-sdk-24]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "25"

      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kyllene-debug-min24
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
