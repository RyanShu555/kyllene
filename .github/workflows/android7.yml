name: Android 7 build (minSdk 24)

# Fork-only helper: produces an installable APK for Android 7.0/7.1 (API 24/25).
on:
  push:
    branches: [android7-min-sdk-24]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "25"

      - name: Fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FORK_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.FORK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > fork-debug.p12
            echo "FORK_STORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "FORK_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kyllene-debug-min24
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
